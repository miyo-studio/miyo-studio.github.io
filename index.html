  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  .lead { color: var(--dim); margin: 0 0 40px; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; }
  .card h2 { margin: 0 0 4px; }
  .card p { color: var(--dim); margin: 0 0 16px; }
  a { color: var(--accent); }
